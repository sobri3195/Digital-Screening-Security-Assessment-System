[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "puskesau-sentinel-inspector"
version = "1.1.0"
description = "Offline-first institutional endpoint inspection"
requires-python = ">=3.11,<3.15"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.9,<3",
    "cryptography>=44,<48",
    "reportlab>=4.2,<5",
    "psutil>=6,<8",
    "httpx>=0.28,<1",
    "idna>=3.7,<4",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15"]
yara = ["yara-python>=4.5,<5"]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
sentinel-inspector = "sentinel_inspector.__main__:main"

[tool.setuptools.package-data]
sentinel_inspector = ["migrations/*.sql", "sentinel.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
