[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "puskesau-sentinel-ai"
version = "3.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.9,<3",
    "SQLAlchemy>=2.0,<3",
    "httpx>=0.28,<1",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.10,<2",
    "psutil>=6,<8",
    "idna>=3.7,<4",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
transformers = ["sentence-transformers>=3.3,<6", "huggingface-hub>=0.28,<2"]

[project.scripts]
sentinel-ai = "sentinel_ai.cli:main"

[tool.setuptools.package-data]
sentinel_ai = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
